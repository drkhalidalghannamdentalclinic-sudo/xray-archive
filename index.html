<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>أرشيف الأشعة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#0b1220;color:#93a1bd;font-family:Tahoma,sans-serif;z-index:99">جاري تحميل الأرشيف…</div>
<div id="listView">
  <header class="top">
    <div class="bar">
      <h1>أرشيف الأشعة</h1>
      <span id="mode" class="chip" title=""></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث باسم المريض أو اسم الملف أو السنة…" autocomplete="off" enterkeyhint="search">
      <button id="clr" type="button" hidden aria-label="مسح">✕</button>
    </div>
    <nav id="years" class="years" aria-label="السنين"></nav>
    <div class="sub">
      <span id="count"></span>
      <select id="sort" aria-label="الترتيب">
        <option value="name">ترتيب بالاسم</option>
        <option value="new">الأحدث أولاً</option>
        <option value="old">الأقدم أولاً</option>
        <option value="files">الأكتر ملفات</option>
      </select>
    </div>
  </header>
  <main id="list" class="cards"></main>
  <div id="more" class="more" hidden><button type="button">عرض المزيد</button></div>
  <footer id="foot" class="foot"></footer>
</div>

<div id="patientView" hidden>
  <header class="top">
    <div class="bar">
      <button id="back" type="button" class="ico" aria-label="رجوع">→</button>
      <div class="ptitle"><h2 id="pname"></h2><div id="pmeta" class="muted"></div></div>
    </div>
  </header>
  <main id="files"></main>
</div>

<div id="viewer" hidden>
  <div class="vtop">
    <button id="vclose" type="button" class="ico" aria-label="إغلاق">✕</button>
    <div class="vtitle"><div id="vname"></div><div id="vinfo" class="muted"></div></div>
    <span id="vquality" class="chip"></span>
  </div>
  <div id="stage">
    <img id="vimg" alt="" draggable="false">
    <video id="vvid" controls playsinline hidden></video>
    <div id="vother" class="other" hidden></div>
    <button id="vprev" type="button" class="nav r" aria-label="السابق">›</button>
    <button id="vnext" type="button" class="nav l" aria-label="التالي">‹</button>
  </div>
  <div class="vtools" id="vtools">
    <button type="button" id="zout" aria-label="تصغير">−</button>
    <button type="button" id="zin" aria-label="تكبير">+</button>
    <button type="button" id="zfit">ملء الشاشة</button>
    <button type="button" id="rot" aria-label="تدوير">⟳</button>
    <button type="button" id="inv">⬓ عكس</button>
    <label>سطوع <input id="bri" type="range" min="40" max="220" value="100"></label>
    <label>تباين <input id="con" type="range" min="40" max="260" value="100"></label>
    <button type="button" id="rst">إعادة</button>
    <button type="button" id="origBtn">الأصلية</button>
    <a id="openOrig" target="_blank" rel="noopener" hidden>فتح</a>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
